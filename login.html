<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | منصة قدورة</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.box{background:#fff;width:100%;max-width:380px;padding:30px;border-radius:20px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3)}
h1{margin:0 0 5px;color:#0f172a}
p{color:#666;margin:0 0 20px}
input{width:100%;padding:13px;margin-bottom:12px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;background:#2563eb;color:#fff;border:0;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer}
a{display:block;margin-top:15px;color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>أهلاً بيك في قدورة ✨</h1>
<p>سجل دخول عشان تكمل</p>
<input type="text" id="name" placeholder="اسمك">
<input type="password" id="pass" placeholder="كلمة السر">
<button onclick="login()">دخول</button>
<a href="index.html">دخول كضيف</a>
</div>
<script>
function login(){
  var n=document.getElementById('name').value;
  if(!n){alert('اكتب اسمك الأول');return;}
  localStorage.setItem('user',n);
  window.location.href='index.html';
}
</script>
</body>
</html>
