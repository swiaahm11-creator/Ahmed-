<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول | منصة قدورة</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.box{background:#fff;width:100%;max-width:400px;padding:30px;border-radius:20px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3)}
h1{margin:0 0 5px;color:#0f172a}
p{color:#666;margin:0 0 20px;font-size:14px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tabs button{flex:1;padding:12px;border:1px solid #ddd;background:#f1f5f9;color:#333;border-radius:12px;cursor:pointer;font-weight:bold}
.tabs button.active{background:#2563eb;color:#fff;border-color:#2563eb}
input{width:100%;padding:13px;margin-bottom:12px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box;direction:ltr;text-align:left}
button.main{width:100%;padding:14px;background:#2563eb;color:#fff;border:0;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer}
#msg{color:red;font-size:14px;margin-top:10px;min-height:20px}
small{color:#888}
</style>
</head>
<body>
<div class="box">
<h1>أهلاً بيك في قدورة ✨</h1>
<p>سجل دخول بالبريد أو برقم التليفون</p>
<div class="tabs">
<button id="btnEmail" class="active" onclick="switchMode('email')">📧 بريد إلكتروني</button>
<button id="btnPhone" onclick="switchMode('phone')">📱 تليفون</button>
</div>
<input type="text" id="loginInput" placeholder="اكتب بريدك الإلكتروني">
<input type="password" id="pass" placeholder="كلمة السر">
<button class="main" onclick="login()">دخول</button>
<div id="msg"></div>
<small>مفيش دخول كضيف، لازم تسجيل دخول</small>
</div>
<script>
let mode='email';
function switchMode(m){
mode=m;
document.getElementById('btnEmail').classList.toggle('active',m==='email');
document.getElementById('btnPhone').classList.toggle('active',m==='phone');
document.getElementById('loginInput').placeholder = m==='email' ? 'اكتب بريدك الإلكتروني' : 'اكتب رقم تليفونك 01xxxxxxxxx';
document.getElementById('loginInput').value='';
document.getElementById('msg').innerText='';
}
function login(){
let val=document.getElementById('loginInput').value.trim();
let pass=document.getElementById('pass').value.trim();
let msg=document.getElementById('msg');
if(!val){msg.innerText='اكتب البريد أو التليفون الأول';return;}
if(!pass){msg.innerText='اكتب كلمة السر';return;}
if(pass.length<4){msg.innerText='كلمة السر لازم 4 حروف على الأقل';return;}
if(mode==='email'){
let emailCheck=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if(!emailCheck.test(val)){msg.innerText='البريد مش مظبوط، اكتبه زي name@gmail.com';return;}
} else {
val=val.replace('+20','').replace(/^20/,'');
let phoneCheck=/^01[0125][0-9]{8}$/;
if(!phoneCheck.test(val)){msg.innerText='رقم التليفون مش مظبوط، اكتبه 11 رقم يبدأ بـ 01';return;}
}
localStorage.setItem('user',val);
localStorage.setItem('loginType',mode);
window.location.href='index.html';
}
</script>
</body>
</html>
